<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Plezy for webOS</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="shell">
    <aside aria-label="Main navigation">
      <div class="brand"><img src="icon.png" alt=""><span>Plezy</span></div>
      <nav id="nav"></nav>
      <!-- The original Flutter rail has no invented tagline/footer. -->
    </aside>
    <main id="main" tabindex="-1"><h1>Starting Plezy…</h1><p class="muted">Initializing the TV app.</p></main>
  </div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <section id="player" aria-label="Video player" hidden>
    <video tabindex="-1" playsinline></video>
    <div class="player-buffering" role="status" aria-label="Buffering" aria-busy="true" hidden><div class="player-spinner" aria-hidden="true"></div></div>
    <div class="player-status" role="alert"></div>
    <!-- Translated from upstream VideoControlsHeader, VideoTimelineBar and
         DesktopVideoControls (icon discs, timeline, compact track controls). -->
    <div class="player-top">
      <div class="player-heading"><h2 class="player-title"></h2><span class="play-method"></span></div>
    </div>
    <div class="controls">
      <div class="timeline-row">
        <span class="elapsed-current" aria-hidden="true">0:00</span>
        <div class="timeline-track">
          <progress max="1" value="0" aria-label="Playback progress"></progress>
          <input type="range" data-action="seek" min="0" max="100" step="1" value="0"
            aria-label="Seek playback" aria-valuetext="0:00" title="Seek playback">
        </div>
        <span class="elapsed-remaining" aria-hidden="true">-0:00</span>
      </div>
      <p class="elapsed" aria-hidden="true" hidden>0:00 / 0:00</p>
      <div class="transport-row">
        <div class="player-buttons">
          <button data-action="backward" class="transport-icon" aria-label="−10 seconds" title="−10 seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6v5h5M4.3 11a8 8 0 1 1 .9 5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="16" text-anchor="middle" font-size="10" font-family="Arial, sans-serif" font-weight="700" fill="currentColor">10</text></svg></button>
          <button data-action="pause" class="transport-icon" aria-label="Pause" title="Pause"><svg class="pause-glyph" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h3v14H7zm7 0h3v14h-3z"/></svg><svg class="play-glyph" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></button>
          <button data-action="forward" class="transport-icon" aria-label="+30 seconds" title="+30 seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M19.7 11a8 8 0 1 0-.9 5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="16" text-anchor="middle" font-size="10" font-family="Arial, sans-serif" font-weight="700" fill="currentColor">30</text></svg></button>
          <button data-action="stop" class="transport-icon" aria-label="Stop" title="Stop"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
        </div>
        <div class="player-secondary">
          <button data-action="options" class="transport-icon" aria-label="Playback settings" title="Playback settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="9" cy="6" r="2.3" fill="currentColor"/><circle cx="15" cy="12" r="2.3" fill="currentColor"/><circle cx="10" cy="18" r="2.3" fill="currentColor"/></svg></button>
          <button data-action="audio-options" class="transport-icon" aria-label="Audio tracks" title="Audio tracks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
          <button data-action="subtitle-options" class="transport-icon" aria-label="Subtitles" title="Subtitles"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 12h5m2 0h5M6 16h12" stroke="currentColor" stroke-width="2"/></svg></button>
          <button data-action="chapter-options" class="transport-icon" aria-label="Chapters" title="Chapters"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2v14H4zm5 0h11v4H9zm0 6h11v4H9zm0 6h11v3H9z" fill="currentColor"/></svg></button>
        </div>
      </div>
    </div>
    <!-- Plezy's SkipMarkerButton floats above playback, including while
         transport chrome is hidden, and counts down in automatic mode. -->
    <button data-action="skip" class="player-skip" aria-label="Skip intro" hidden>
      <span class="skip-progress" aria-hidden="true"></span>
      <span class="skip-label">Skip intro</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v14l9-7zm10 0v14l9-7z" fill="currentColor"/></svg>
    </button>
    <!-- Upstream TrackChapterControls opens a sheet, rather than rendering
         oversized native HTML dropdowns on the video itself. -->
    <div class="player-sheet" hidden>
      <div class="player-sheet-header">
        <h3 data-sheet-title>Playback settings</h3>
        <button data-action="close-options" aria-label="Close playback settings">Close</button>
      </div>
      <div class="player-options-list"></div>
      <div class="track-controls">
        <label data-chapters hidden>Chapters <select aria-label="Chapter" data-chapter></select></label>
        <label>Audio <select data-track="audio" aria-label="Audio track"></select></label>
        <label>Subtitles <select data-track="subtitle" aria-label="Subtitle track"></select></label>
        <button data-action="transcode" class="player-pill">Compatible playback</button>
      </div>
    </div>
  </section>
  <section id="dialog" role="dialog" aria-modal="true" aria-label="Confirm exit" hidden></section>
  <script>
    // The shell is static HTML; a missing or broken bundle must never leave
    // only the logo and an empty main view on a physical television.
    (function () {
      function bootError(message) {
        var main = document.getElementById('main');
        if (!main || document.querySelector('#nav button')) return;
        main.textContent = '';
        var heading = document.createElement('h1');
        heading.textContent = 'Plezy could not start';
        var details = document.createElement('p');
        details.className = 'error';
        details.textContent = message;
        main.appendChild(heading);
        main.appendChild(details);
      }
      window.addEventListener('error', function (event) {
        var message = event.message || 'Application script failed to load.';
        var filename = event.filename ? event.filename.split('/').pop().split('?')[0] : '';
        if (filename) message += String.fromCharCode(10) + 'Script: ' + filename +
          (event.lineno ? ' line ' + event.lineno : '') +
          (event.colno ? ', column ' + event.colno : '');
        var agent = navigator.userAgent || '';
        var enginePosition = agent.indexOf('Chrome/');
        if (enginePosition !== -1) {
          var major = parseInt(agent.substring(enginePosition + 7), 10);
          if (major > 0) message += String.fromCharCode(10) + 'TV browser engine: Chromium ' + major;
        }
        bootError(message);
      });
      window.addEventListener('unhandledrejection', function (event) {
        bootError((event.reason && event.reason.message) || 'An unexpected startup error occurred.');
      });
      window.setTimeout(function () {
        var main = document.getElementById('main');
        if (main && main.textContent.indexOf('Starting Plezy') !== -1 &&
            !document.querySelector('#nav button')) {
          bootError('The application script did not initialize. Please install a newly built IPK and inspect the webOS console.');
        }
      }, 4000);
    })();
  </script>
  <script src="app.js" defer onerror="document.getElementById('main').textContent = 'Plezy could not load its application script. Reinstall the package.'"></script>
</body>
</html>
