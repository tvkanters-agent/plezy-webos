name: webOS TV
on:
  push:
    paths: ['webos/**', '.github/workflows/webos.yml']
  pull_request:
    paths: ['webos/**', '.github/workflows/webos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webos/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: plezy-webos-ipk
          path: webos/build/*.ipk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webos-test-results
          path: webos/test-results/
