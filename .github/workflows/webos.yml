name: webOS TV
on:
  push:
    paths: ['webos/**', '.github/workflows/webos.yml']
  pull_request:
    paths: ['webos/**', '.github/workflows/webos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: webos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webos/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: plezy-webos-ipk
          path: webos/build/*.ipk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webos-test-results
          path: webos/test-results/
  release:
    needs: test-and-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: plezy-webos-ipk
          path: release-assets
      - name: Publish versioned webOS release when release notes exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./webos/package.json').version")
          notes="webos/releases/v${version}.md"
          if [ ! -f "$notes" ]; then exit 0; fi
          if gh release view "v${version}" >/dev/null 2>&1; then exit 0; fi
          gh release create "v${version}" release-assets/*.ipk \
            --target "$GITHUB_SHA" --prerelease \
            --title "Plezy webOS ${version} alpha" --notes-file "$notes"
